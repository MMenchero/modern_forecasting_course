[tool.poetry]
name = "modern-forecasting-course"
version = "0.1.0"
description = "Modern Forecasting Course with statistical, ML, and neural forecasting methods"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
pandas = "^2.0"
numpy = "^1.24"
matplotlib = "^3.7"
seaborn = "^0.13"
plotly = "^5.18"
statsforecast = "^1.7"
mlforecast = "^0.13"
neuralforecast = "^1.7"
nixtla = "^0.7"
jupyter = "^1.0"
ipykernel = "^6.29"
python-dotenv = "^1.2.1"
hierarchicalforecast = "^1.4.0"
lightgbm = "^4.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
